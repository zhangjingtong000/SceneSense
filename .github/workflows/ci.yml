name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (F,E9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff
      - name: 静态检查（未使用 import、未使用变量、语法错误）
        run: ruff check --select F,E9 .

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 README 声明的最低版本，3.12 是常用稳定版
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 系统库（OpenCV 需要 libGL / libglib）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 安装 CPU 版 torch（避免拉 CUDA 轮子）
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: 安装依赖
        run: python -m pip install -r requirements.txt ruff

      # requirements.txt 把 Web 相关依赖列为可选（注释掉），但 tests/web/ 会 import
      # fastapi 与 starlette.testclient（依赖 httpx），这里显式补装，避免收集期报错。
      - name: 装 web 依赖
        run: python -m pip install fastapi uvicorn python-multipart httpx

      - name: 测试
        run: python -m pytest -q
